[project]
name = "insureassist"
version = "0.1.0"
description = "Insurance knowledge assistant (RAG) - portfolio project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "pydantic-settings>=2.4",
    "sentence-transformers>=6.0",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "google-genai>=1.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.40",
    "qdrant-client>=1.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.scripts]
insureassist = "insureassist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insureassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"  # fast by default; real-model tests: uv run pytest -m slow
markers = ["slow: loads a real ML model (downloads it on first run)"]
filterwarnings = [
    # Expected in tests only: Qdrant's local (folder) mode ignores payload indexes.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
    # Only when Qdrant is unreachable (tested on purpose); our own clearer error is raised.
    "ignore:Failed to obtain server version:UserWarning",
    # Third-party notice from FastAPI's TestClient (not our code).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # docs contain illustrative code sketches, not real code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # pytest asserts; fixed test passwords; random test inputs

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pymupdf", "fitz", "sentence_transformers", "sentence_transformers.*", "faiss", "rank_bm25", "pandas", "pandas.*"]
ignore_missing_imports = true

# PyMuPDF's type hints are incomplete, so calls into it count as "untyped".
[[tool.mypy.overrides]]
module = [
    "insureassist.ingestion.pdf_reader",
    "insureassist.ingestion.vector_store",
    "insureassist.retrieval.keyword_search",
]
disallow_untyped_calls = false
